payment:
  expiration:
    enabled: false
  refund-reconciliation:
    enabled: false

outbox:
  chat-message:
    enabled: false

spring:
  ai:
    openai:
      api-key: test-key
      chat:
        model: gpt-4o-mini
  retry:
    max-attempts: 1

  kafka:
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: bobfull-chat-moderation
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.bobfull.chat.application.event
        spring.json.value.default.type: com.bobfull.chat.application.event.ChatMessageCreatedEvent
    listener:
      ack-mode: RECORD

  mail:
    host: localhost
    port: 1025

notification:
  email:
    from-address: no-reply@bobfull-test.com

cors:
  allowed-origins: http://localhost:5173

auth:
  refresh-token:
    expiration-seconds: 1209600

aws:
  region: ap-northeast-2
  s3:
    image-bucket: bobfull-test-image-bucket
    upload-url-expiration: 5m
    get-url-expiration: 5m

bobfull:
  ai:
    moderation:
      max-output-tokens: 128
  kafka:
    chat-message:
      consumer-enabled: false
      topic-auto-create-enabled: false

chat:
  redis-pubsub:
    # 단위·기존 통합 테스트가 외부 Redis listener를 띄우지 않도록 한다. publisher는 테스트 double로 검증한다.
    subscriber-enabled: false
