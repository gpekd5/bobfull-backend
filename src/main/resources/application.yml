spring:
  application:
    name: bobfull-backend
  jackson:
    time-zone: Asia/Seoul

  kafka:
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        enable.idempotence: true
    consumer:
      group-id: ${KAFKA_CHAT_MODERATION_GROUP_ID:bobfull-chat-moderation}
      auto-offset-reset: earliest
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.bobfull.chat.application.event
        spring.json.value.default.type: com.bobfull.chat.application.event.ChatMessageCreatedEvent
    listener:
      ack-mode: RECORD

management:
  endpoint:
    prometheus:
      access: read-only
  endpoints:
    web:
      exposure:
        include:
          - health
          - prometheus
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true

chat:
  redis-pubsub:
    # 실시간 전파 자체의 feature toggle이 아니다. listener container만 제어하며 production에서는 항상 활성화한다.
    subscriber-enabled: true
    channel: bobfull:chat:messages
    reconnect-delay: 5s
