global:
  scrape_interval: 1s
  scrape_timeout: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: issue68-dashboard-fake
    metrics_path: /metrics
    static_configs:
      - targets: [host.docker.internal:18068]
    # 원래 Meter 이름을 유지해야 기존 Dashboard의 수정 없는 PromQL과 일치한다.
    # 별도 TSDB이며 기존 8080 앱을 수집하는 job은 없다.
    metric_relabel_configs:
      - source_labels: [harness_scope]
        regex: issue68_fake
        action: keep
