global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: bobfull-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8080

  # 명시적으로 실행한 Fake Harness만 일시 등록한다. 기본 앱/Dashboard 합계에 섞지 않는다.
  - job_name: issue68-harness-fake
    scrape_interval: 1s
    metrics_path: /metrics
    file_sd_configs:
      - files: [/etc/prometheus/issue68/targets.json]
        refresh_interval: 1s
    metric_relabel_configs:
      - source_labels: [__name__]
        regex: '(gen_ai_.*|spring_ai_.*|okhttp_.*|bobfull_ai_moderation_.*)'
        action: keep
      - source_labels: [__name__]
        regex: '(.*)'
        target_label: __name__
        replacement: 'issue68_test_$1'
