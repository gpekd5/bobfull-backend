services:
  prometheus:
    image: ${PROMETHEUS_IMAGE:-prom/prometheus:latest}
    container_name: bobfull-prometheus
    restart: unless-stopped
    entrypoint:
      - /bin/sh
      - -c
    command:
      - |
        set -eu
        mkdir -p /tmp/prometheus-targets
        targets="$${BOBFULL_BACKEND_METRICS_TARGETS:-}"
        if [ -z "$${targets}" ]; then
          targets="$${BOBFULL_BACKEND_METRICS_TARGET:-}"
        fi
        if [ -z "$${targets}" ]; then
          echo "set BOBFULL_BACKEND_METRICS_TARGETS or BOBFULL_BACKEND_METRICS_TARGET" >&2
          exit 1
        fi

        target_file=/tmp/prometheus-targets/bobfull-backend.yml
        printf -- "- targets:\n" > "$${target_file}"
        target_count=0
        old_ifs="$${IFS}"
        IFS=","
        for raw_target in $${targets}; do
          target="$(printf '%s' "$${raw_target}" | sed 's/^[[:space:]]*//; s/[[:space:]]*$$//')"
          if [ -n "$${target}" ]; then
            printf "  - '%s'\n" "$${target}" >> "$${target_file}"
            target_count=$$((target_count + 1))
          fi
        done
        IFS="$${old_ifs}"
        if [ "$${target_count}" -eq 0 ]; then
          echo "no valid backend metrics targets configured" >&2
          exit 1
        fi
        exec /bin/prometheus \
          --config.file=/etc/prometheus/prometheus.yml \
          --storage.tsdb.path=/prometheus \
          --web.enable-lifecycle
    environment:
      BOBFULL_BACKEND_METRICS_TARGETS: ${BOBFULL_BACKEND_METRICS_TARGETS:-}
      BOBFULL_BACKEND_METRICS_TARGET: ${BOBFULL_BACKEND_METRICS_TARGET:-}
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

  grafana:
    image: ${GRAFANA_IMAGE:-grafana/grafana-oss:latest}
    container_name: bobfull-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set grafana admin password}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_UNIFIED_ALERTING_ENABLED: "true"
      GRAFANA_SLACK_WEBHOOK_URL: ${GRAFANA_SLACK_WEBHOOK_URL:?set grafana slack webhook url}
      GRAFANA_SLACK_RECIPIENT: ${GRAFANA_SLACK_RECIPIENT:?set grafana slack recipient}
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  prometheus-data:
  grafana-data:
