apiVersion: 1

contactPoints:
  - orgId: 1
    name: slack-monitoring
    receivers:
      - uid: slack-monitoring
        type: slack
        settings:
          url: ${GRAFANA_SLACK_WEBHOOK_URL}
          recipient: ${GRAFANA_SLACK_RECIPIENT}
          title: BobFull monitoring alert
          text: |
            {{ range .Alerts }}
            [{{ .Status }}] {{ .Labels.alertname }} severity={{ .Labels.severity }}
            {{ .Annotations.summary }}
            {{ .Annotations.description }}
            {{ end }}
        disableResolveMessage: false
