<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BobFull V1 Flow Lab</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="top-bar">
  <span class="brand">BOBFULL V1 FLOW</span>
  <nav class="chapter-nav" id="chapter-nav" role="tablist" aria-label="V1 사용자 여정 Chapter"></nav>
  <span class="top-meta" id="top-meta"></span>
</header>

<section class="scenario-bar" aria-label="시나리오 설정과 실행">
  <nav id="action-tabs" role="tablist" aria-label="사용자 행동 선택"></nav>
  <div class="scenario-run" id="role-panel-body"></div>
</section>

<main class="page">

  <section class="flow-section" id="flowchart-section" aria-label="핵심 백엔드 흐름">
    <div id="swimflow" class="swimflow"></div>
    <div id="substeps" class="substeps"></div>
  </section>

  <section class="split-row">
    <div class="code-col" id="code-col" aria-label="실제 코드"></div>
    <div class="state-col" id="core-state" aria-label="핵심 상태"><div id="core-state-body"></div></div>
  </section>

  <section class="detail-panel" id="detail-section" aria-label="설계 설명·실행 증거·성능 관찰">
    <div class="detail-tabs" id="detail-tabs" role="tablist"></div>
    <div class="detail-body" id="detail-body"></div>
  </section>

</main>

<footer class="bottom-bar" id="bottom-bar" aria-label="Timeline과 실행 제어">
  <div class="timeline" id="timeline"></div>
  <div class="bottom-controls">
    <button type="button" id="btn-prev">이전</button>
    <button type="button" id="btn-next">다음</button>
    <button type="button" id="btn-auto">자동 실행</button>
    <button type="button" id="btn-pause">정지</button>
    <button type="button" id="btn-reset">처음부터</button>
    <span class="step-counter" id="step-counter">단계 -/-</span>
  </div>
</footer>

<script src="app.js"></script>
</body>
</html>
