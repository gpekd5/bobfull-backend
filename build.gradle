plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.sonarqube' version '7.5.0.8588'
}

group = 'com.bobfull'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

sonar {
	properties {
		property 'sonar.projectKey', 'bobfull-backend'
		property 'sonar.projectName', 'BobFull Backend'
		property 'sonar.sourceEncoding', 'UTF-8'
	}
}

dependencies {
	implementation platform('org.springframework.ai:spring-ai-bom:2.0.0')
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-mail'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.ai:spring-ai-starter-model-openai'
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation platform('software.amazon.awssdk:bom:2.31.78')
	implementation 'software.amazon.awssdk:s3'
	implementation 'com.querydsl:querydsl-jpa:5.1.0:jakarta'
	implementation 'io.portone:server-sdk:0.24.0'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-gson:0.12.6'
	runtimeOnly 'io.micrometer:micrometer-registry-prometheus'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'com.mysql:mysql-connector-j'
	annotationProcessor 'com.querydsl:querydsl-apt:5.1.0:jakarta'
	annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.kafka:spring-kafka-test'
	testImplementation 'org.springframework.boot:spring-boot-testcontainers'
	testImplementation 'org.testcontainers:testcontainers-kafka'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'com.h2database:h2'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
	if (System.getProperty('os.name').toLowerCase().contains('mac')) {
		def macOsClassifier = System.getProperty('os.arch').toLowerCase().contains('aarch64')
				|| System.getProperty('os.arch').toLowerCase().contains('arm64') ? 'osx-aarch_64' : 'osx-x86_64'
		runtimeOnly('io.netty:netty-resolver-dns-native-macos') {
			artifact {
				classifier = macOsClassifier
				type = 'jar'
				extension = 'jar'
			}
		}
	}
}

tasks.named('test') {
	useJUnitPlatform {
		excludeTags 'kafka-evidence'
	}
	// #277: 전체 suite가 한 JVM에서 수백 개의 서로 다른 Spring TestContext를 순차 기동하면서
	// 기본 힙으로는 간헐적으로 메모리 압박(BeanCreationException 등 무작위 실패)이 발생함을
	// 실측(JAVA_TOOL_OPTIONS=-Xmx2g 재현, -Xmx4g 해소)으로 확인해 명시적으로 늘렸다.
	maxHeapSize = '4g'
	if (project.hasProperty('showTestOutput')) {
		testLogging {
			showStandardStreams = true
		}
	}
}

tasks.register('kafkaEvidenceTest', Test) {
	description = 'Runs Kafka/Testcontainers evidence experiments excluded from the default test task.'
	group = 'verification'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform {
		includeTags 'kafka-evidence'
	}
}
