name: Deploy Backend V1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-backend-v1.yml'
      - 'Dockerfile'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle/**'
      - 'gradlew'
      - 'lambda/**'
      - 'ops/deployment/aws/**'
      - 'src/**'
  workflow_dispatch: {}

concurrency:
  group: backend-v1-deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  BACKEND_PARAMETER_PREFIX: ${{ vars.BACKEND_PARAMETER_PREFIX }}
  BACKEND_ALB_LISTENER_ARN: ${{ vars.BACKEND_ALB_LISTENER_ARN }}
  BACKEND_BLUE_TARGET_GROUP_ARN: ${{ vars.BACKEND_BLUE_TARGET_GROUP_ARN }}
  BACKEND_GREEN_TARGET_GROUP_ARN: ${{ vars.BACKEND_GREEN_TARGET_GROUP_ARN }}
  BACKEND_PUBLIC_READINESS_URL: ${{ vars.BACKEND_PUBLIC_READINESS_URL }}
  BACKEND_PUBLIC_API_VERIFY_URL: ${{ vars.BACKEND_PUBLIC_API_VERIFY_URL }}
  BACKEND_MONITORING_EC2_INSTANCE_ID: ${{ vars.BACKEND_MONITORING_EC2_INSTANCE_ID }}
  BACKEND_MONITORING_COMPOSE_DIR: ${{ vars.BACKEND_MONITORING_COMPOSE_DIR }}
  BACKEND_MONITORING_ENV_FILE: ${{ vars.BACKEND_MONITORING_ENV_FILE }}

jobs:
  ci:
    name: Gradle check and bootJar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Gradle build and test
        run: |
          set -euo pipefail
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew
          ./gradlew clean check bootJar --no-daemon

      - name: Upload bootJar artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-boot-jar
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Push to ECR and deploy with SSM
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate deployment settings
        env:
          AWS_ROLE_TO_ASSUME: ${{ secrets.AWS_ROLE_TO_ASSUME }}
        run: |
          set -euo pipefail

          required_values=(
            AWS_REGION
            ECR_REPOSITORY
            BACKEND_PARAMETER_PREFIX
            BACKEND_ALB_LISTENER_ARN
            BACKEND_BLUE_TARGET_GROUP_ARN
            BACKEND_GREEN_TARGET_GROUP_ARN
            BACKEND_PUBLIC_READINESS_URL
            BACKEND_PUBLIC_API_VERIFY_URL
            BACKEND_MONITORING_EC2_INSTANCE_ID
            BACKEND_MONITORING_COMPOSE_DIR
            BACKEND_MONITORING_ENV_FILE
            AWS_ROLE_TO_ASSUME
          )

          for key in "${required_values[@]}"; do
            if [ -z "${!key:-}" ]; then
              echo "Missing required GitHub secret or variable: ${key}" >&2
              exit 1
            fi
          done

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve image URI
        id: image
        run: |
          set -euo pipefail

          account_id="$(aws sts get-caller-identity --query Account --output text)"
          ecr_registry="${account_id}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          image_uri="${ecr_registry}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "ecr_registry=${ecr_registry}" >> "${GITHUB_OUTPUT}"
          echo "image_uri=${image_uri}" >> "${GITHUB_OUTPUT}"

      - name: Verify ECR repository exists
        run: |
          set -euo pipefail

          if ! repository_check_output="$(aws ecr describe-repositories \
            --region "${AWS_REGION}" \
            --repository-names "${ECR_REPOSITORY}" 2>&1)"; then
            echo "${repository_check_output}" >&2
            echo "ECR repository '${ECR_REPOSITORY}' does not exist or cannot be described in region '${AWS_REGION}'." >&2
            echo "Create the ECR repository before deployment. This workflow intentionally does not create repositories automatically." >&2
            exit 1
          fi

          echo "ECR repository '${ECR_REPOSITORY}' exists."

      - name: Check ECR image tag
        id: ecr_image
        run: |
          set -euo pipefail

          image_uri="${{ steps.image.outputs.image_uri }}"
          if image_check_output="$(aws ecr describe-images \
            --region "${AWS_REGION}" \
            --repository-name "${ECR_REPOSITORY}" \
            --image-ids imageTag="${GITHUB_SHA}" 2>&1)"; then
            echo "exists=true" >> "${GITHUB_OUTPUT}"
            echo "ECR image '${image_uri}' already exists. Reusing existing immutable SHA image."
            exit 0
          fi

          if printf '%s\n' "${image_check_output}" | grep -q 'ImageNotFoundException'; then
            echo "exists=false" >> "${GITHUB_OUTPUT}"
            echo "ECR image '${image_uri}' does not exist. Building and pushing SHA image."
            exit 0
          fi

          echo "${image_check_output}" >&2
          echo "Failed to describe ECR image tag '${GITHUB_SHA}' in repository '${ECR_REPOSITORY}'." >&2
          exit 1

      - name: Login to ECR
        if: steps.ecr_image.outputs.exists != 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Download bootJar artifact
        if: steps.ecr_image.outputs.exists != 'true'
        uses: actions/download-artifact@v4
        with:
          name: backend-boot-jar
          path: build/libs

      - name: Build and push Docker image
        if: steps.ecr_image.outputs.exists != 'true'
        run: |
          set -euo pipefail

          docker build -t "${{ steps.image.outputs.image_uri }}" .
          docker push "${{ steps.image.outputs.image_uri }}"

      - name: Reuse existing Docker image
        if: steps.ecr_image.outputs.exists == 'true'
        run: |
          set -euo pipefail
          echo "Using existing ECR image '${{ steps.image.outputs.image_uri }}' for SSM deployment."

      - name: Blue-Green deploy with SSM and ALB
        env:
          ECR_IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          PARAMETER_PREFIX: ${{ env.BACKEND_PARAMETER_PREFIX }}
          BACKEND_TARGET_PORT: ${{ vars.BACKEND_TARGET_PORT }}
          BACKEND_TG_HEALTH_TIMEOUT_SECONDS: ${{ vars.BACKEND_TG_HEALTH_TIMEOUT_SECONDS }}
          BACKEND_TG_HEALTH_POLL_INTERVAL_SECONDS: ${{ vars.BACKEND_TG_HEALTH_POLL_INTERVAL_SECONDS }}
          BACKEND_PUBLIC_VERIFY_ATTEMPTS: ${{ vars.BACKEND_PUBLIC_VERIFY_ATTEMPTS }}
          BACKEND_PUBLIC_VERIFY_DELAY_SECONDS: ${{ vars.BACKEND_PUBLIC_VERIFY_DELAY_SECONDS }}
          BACKEND_PUBLIC_VERIFY_TIMEOUT_SECONDS: ${{ vars.BACKEND_PUBLIC_VERIFY_TIMEOUT_SECONDS }}
          BACKEND_LISTENER_WEIGHT_TIMEOUT_SECONDS: ${{ vars.BACKEND_LISTENER_WEIGHT_TIMEOUT_SECONDS }}
          BACKEND_LISTENER_WEIGHT_POLL_INTERVAL_SECONDS: ${{ vars.BACKEND_LISTENER_WEIGHT_POLL_INTERVAL_SECONDS }}
          BACKEND_EC2_STATE_TIMEOUT_SECONDS: ${{ vars.BACKEND_EC2_STATE_TIMEOUT_SECONDS }}
          BACKEND_EC2_STATE_POLL_INTERVAL_SECONDS: ${{ vars.BACKEND_EC2_STATE_POLL_INTERVAL_SECONDS }}
          BACKEND_SSM_ONLINE_TIMEOUT_SECONDS: ${{ vars.BACKEND_SSM_ONLINE_TIMEOUT_SECONDS }}
          BACKEND_SSM_ONLINE_POLL_INTERVAL_SECONDS: ${{ vars.BACKEND_SSM_ONLINE_POLL_INTERVAL_SECONDS }}
          BACKEND_PREVIOUS_ENV_KEEP_SECONDS: ${{ vars.BACKEND_PREVIOUS_ENV_KEEP_SECONDS }}
          BACKEND_MONITORING_ENV_FILE: ${{ env.BACKEND_MONITORING_ENV_FILE }}
          BACKEND_PROMETHEUS_CONTAINER_NAME: ${{ vars.BACKEND_PROMETHEUS_CONTAINER_NAME }}
          BACKEND_PROMETHEUS_TARGET_FILE: ${{ vars.BACKEND_PROMETHEUS_TARGET_FILE }}
          BACKEND_PROMETHEUS_PORT: ${{ vars.BACKEND_PROMETHEUS_PORT }}
          BACKEND_PROMETHEUS_TARGET_UP_TIMEOUT_SECONDS: ${{ vars.BACKEND_PROMETHEUS_TARGET_UP_TIMEOUT_SECONDS }}
          BACKEND_PROMETHEUS_TARGET_UP_POLL_INTERVAL_SECONDS: ${{ vars.BACKEND_PROMETHEUS_TARGET_UP_POLL_INTERVAL_SECONDS }}
          BACKEND_PROMETHEUS_SSM_DOCUMENT_NAME: ${{ vars.BACKEND_PROMETHEUS_SSM_DOCUMENT_NAME }}
          BACKEND_PROMETHEUS_SSM_TIMEOUT_SECONDS: ${{ vars.BACKEND_PROMETHEUS_SSM_TIMEOUT_SECONDS }}
          BACKEND_PROMETHEUS_SSM_POLL_INTERVAL_SECONDS: ${{ vars.BACKEND_PROMETHEUS_SSM_POLL_INTERVAL_SECONDS }}
        run: |
          set -euo pipefail
          bash ops/deployment/aws/deploy-backend-blue-green-v1.sh

      - name: Verify backend deployment
        env:
          AWS_REGION: ${{ env.AWS_REGION }}
          PARAMETER_PREFIX: ${{ env.BACKEND_PARAMETER_PREFIX }}
          CLOUDWATCH_LOG_GROUP: /bobfull/backend
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
        run: |
          set -euo pipefail
          bash ops/deployment/aws/verify-backend-v1.sh
